spring.application.name=oferta-educativa
server.port=8080

# Base de datos H2 en memoria (se reinicia en cada arranque)
spring.datasource.url=jdbc:h2:mem:oferta_educativa;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:oferta_educativa)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

