<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel del Secretario</title><link rel="stylesheet" href="css/styles.css"></head>
<body>
<main>
  <div class="card">
    <h2>Solicitudes Pendientes de Revisión (HU10)</h2>
    <table>
      <thead><tr><th>Tipo</th><th>Nombre</th><th>Descripción</th><th>Tipo de Solicitud / Estado</th><th>Acciones</th></tr></thead>
      <tbody id="tSolicitudes"><tr><td colspan="5" class="empty">Cargando…</td></tr></tbody>
    </table>
  </div>
</main>
<script src="js/api.js"></script>
<script>
renderHeader();
const $t = document.getElementById('tSolicitudes');

async function cargarSolicitudes() {
  const r = await Api.secretario.listarSolicitudes();
  if (!r.ok) { $t.innerHTML = `<tr><td colspan="5" class="empty">Error al cargar solicitudes</td></tr>`; return toast(r.data?.mensaje || 'Error', 'err'); }
  if (!r.data.length) { $t.innerHTML = `<tr><td colspan="5" class="empty">No hay solicitudes pendientes en este momento</td></tr>`; return; }

  $t.innerHTML = r.data.map(x => `<tr>
    <td><b>${esc(x.tipo)}</b></td>
    <td>${esc(x.nombre)}</td>
    <td>${esc(x.descripcion)}</td>
    <td>${badge(x.estadoAprobacion)}<br><small style="color: #666;">${esc(x.tipoSolicitud)}</small></td>
    <td class="actions">
      <button class="btn sm" data-accion="aprobar" data-tipo="${x.tipo}" data-id="${x.id}" data-nombre="${esc(x.nombre)}">Aprobar</button>
      <button class="btn sm danger" data-accion="rechazar" data-tipo="${x.tipo}" data-id="${x.id}" data-nombre="${esc(x.nombre)}">Rechazar</button>
    </td>
  </tr>`).join('');
}

$t.addEventListener('click', async e => {
  const b = e.target.closest('button[data-accion]'); if (!b) return;
  const { tipo, id, nombre } = b.dataset;

  // HU12: pide el motivo obligatorio y rechaza
  if (b.dataset.accion === 'rechazar') {
    if (await rechazarSolicitud(tipo, id, nombre)) cargarSolicitudes();
    return;
  }

  // HU11
  if (!(await confirmar('¿Estás seguro de aprobar esta solicitud?'))) return;
  const r = await Api.secretario.aprobar(tipo, id);
  if (r.ok) { toast(r.data.mensaje); cargarSolicitudes(); }
  else toast(r.data?.mensaje || 'Error al aprobar', 'err');
});

cargarSolicitudes();
</script>
</body></html>
