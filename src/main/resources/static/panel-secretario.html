<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel del Secretario</title><link rel="stylesheet" href="css/styles.css"></head>
<body>
<main>
  <div class="card">
    <h2>Solicitudes Pendientes de Revisión (HU10)</h2>
    <table>
      <thead><tr><th>Tipo</th><th>Nombre</th><th>Descripción</th><th>Tipo de Solicitud / Estado</th><th>Acciones</th></tr></thead>
      <tbody id="tSolicitudes"><tr><td colspan="5" class="empty">Cargando…</td></tr></tbody>
    </table>
  </div>
</main>
<script src="js/api.js"></script>
<script>
renderHeader();

async function cargarSolicitudes() {
  const $t = document.getElementById('tSolicitudes');
  const r = await Api.secretario.listarSolicitudes();
  if (!r.ok) { $t.innerHTML = `<tr><td colspan="5" class="empty">Error al cargar solicitudes</td></tr>`; return toast(r.data?.mensaje || 'Error', 'err'); }
  if (!r.data.length) { $t.innerHTML = `<tr><td colspan="5" class="empty">No hay solicitudes pendientes en este momento</td></tr>`; return; }

  $t.innerHTML = r.data.map(x => `<tr>
    <td><b>${esc(x.tipo)}</b></td>
    <td>${esc(x.nombre)}</td>
    <td>${esc(x.descripcion)}</td>
    <td>${badge(x.estadoAprobacion)}<br><small style="color: #666;">${esc(x.tipoSolicitud)}</small></td>
    <td class="actions">
      <button class="btn sm" onclick="aprobar('${x.tipo}', ${x.id})">Aprobar</button>
      <button class="btn sm danger" onclick="pedirMotivoYRechazar('${x.tipo}', ${x.id})">Rechazar</button>
    </td>
  </tr>`).join('');
}

async function aprobar(tipo, id) {
  if (!(await confirmar('¿Estás seguro de aprobar esta solicitud?'))) return;
  const r = await Api.secretario.aprobar(tipo, id);
  if (r.ok) { toast(r.data.mensaje); cargarSolicitudes(); }
  else toast(r.data?.mensaje || 'Error al aprobar', 'err');
}

// Modal bonito para ingresar el motivo de rechazo
function pedirMotivoYRechazar(tipo, id) {
  return new Promise(resolve => {
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `
      <div class="modal">
        <h3>Motivo de rechazo</h3>
        <p>Por favor, ingresa la razón por la cual se rechaza esta solicitud:</p>
        <div class="field" style="margin: 15px 0;">
          <textarea id="inputMotivo" rows="4" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;" placeholder="Escribe aquí el motivo..."></textarea>
        </div>
        <div class="form-actions">
          <button class="btn secondary" id="btnCancelar">Cancelar</button>
          <button class="btn danger" id="btnConfirmar">Rechazar solicitud</button>
        </div>
      </div>`;

    document.body.appendChild(bg);

    bg.querySelector('#btnCancelar').addEventListener('click', () => {
      bg.remove();
      resolve(false);
    });

    bg.querySelector('#btnConfirmar').addEventListener('click', async () => {
      const motivo = bg.querySelector('#inputMotivo').value.trim();
      if (!motivo) {
        alert('El motivo de rechazo es obligatorio');
        return;
      }
      bg.remove();
      
      // Ejecutar la petición de rechazo
      const r = await Api.secretario.rechazar(tipo, id, motivo);
      if (r.ok) { 
        toast(r.data.mensaje); 
        cargarSolicitudes(); 
      } else {
        toast(r.data?.mensaje || 'Error al rechazar', 'err');
      }
      resolve(true);
    });
  });
}

cargarSolicitudes();
</script>
</body></html>
