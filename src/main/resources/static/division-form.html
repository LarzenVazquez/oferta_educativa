<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>División</title><link rel="stylesheet" href="css/styles.css"></head>
<body>
<main><div class="card" style="max-width:640px">
  <h2 id="titulo">Registrar división</h2>
  <div id="aviso"></div>
  <form id="form" novalidate>
    <div class="field"><label for="nombre">Nombre</label><input id="nombre" name="nombre">
      <div class="error" data-for="nombre"></div></div>
    <div class="field"><label for="descripcion">Descripción</label><textarea id="descripcion" name="descripcion"></textarea>
      <div class="error" data-for="descripcion"></div></div>
    <div class="field"><label for="estatus">Estatus</label>
      <select id="estatus" name="estatus"><option value="ACTIVO">Activo</option><option value="INACTIVO">Inactivo</option></select>
      <div class="error" data-for="estatus"></div></div>
    <div class="form-actions"><button class="btn" type="submit">Guardar</button><a class="btn secondary" href="index.html">Cancelar</a></div>
  </form>
</div></main>
<script src="js/api.js"></script>
<script>
renderHeader();
const form = document.getElementById('form'), id = idDeUrl();

async function precargar() {
  document.getElementById('titulo').textContent = 'Editar división';
  const r = await Api.divisiones.obtener(id);
  if (!r.ok) { toast(r.data?.mensaje || 'Error', 'err'); return; }
  const d = r.data;
  form.nombre.value = d.nombre; form.descripcion.value = d.descripcion; form.estatus.value = d.estatus;
  if (d.estadoAprobacion === 'RECHAZADO' && d.motivoRechazo)
    document.getElementById('aviso').innerHTML = `<div class="note red"><b>Rechazada:</b> ${esc(d.motivoRechazo)}</div>`;
  if (['PENDIENTE', 'PENDIENTE_DESACTIVACION'].includes(d.estadoAprobacion)) {
    document.getElementById('aviso').innerHTML = `<div class="note">Tiene una solicitud en revisión; no se puede modificar.</div>`;
    form.querySelector('[type=submit]').disabled = true;
  }
}

form.addEventListener('submit', async e => {
  e.preventDefault(); limpiarErrores(form);
  const body = { nombre: form.nombre.value, descripcion: form.descripcion.value, estatus: form.estatus.value };
  const r = id ? await Api.divisiones.editar(id, body) : await Api.divisiones.crear(body);
  if (r.ok) { toast(r.data.mensaje); setTimeout(() => location.href = 'index.html', 700); }
  else manejarError(form, r);
});
if (id) precargar();
</script>
</body></html>
