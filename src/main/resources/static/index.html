<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oferta académica</title><link rel="stylesheet" href="css/styles.css"></head>
<body>
<main>
  <div class="card">
    <h2>Oferta académica (HU07)</h2>
    <div class="toolbar">
      <input id="fNombre" type="search" placeholder="Buscar por nombre…">
      <select id="fDivision"><option value="">Todas las divisiones</option></select>
      <span class="spacer"></span>
      <a class="btn" href="division-form.html">+ División</a>
      <a class="btn" href="carrera-form.html">+ Carrera</a>
    </div>
    <table>
      <thead><tr><th>Tipo</th><th>Nombre</th><th>División</th><th>Estatus</th><th>Aprobación (HU09)</th><th></th></tr></thead>
      <tbody id="tbody"><tr><td colspan="6" class="empty">Cargando…</td></tr></tbody>
    </table>
  </div>
</main>
<script src="js/api.js"></script>
<script>
renderHeader();
const $nombre = document.getElementById('fNombre'), $div = document.getElementById('fDivision'), $tbody = document.getElementById('tbody');

async function cargarDivisiones() {
  const r = await Api.divisiones.listar();
  if (r.ok) r.data.forEach(d => $div.insertAdjacentHTML('beforeend', `<option value="${d.id}">${esc(d.nombre)}</option>`));
}

function fila(f) {
  const base = f.tipo === 'DIVISION' ? 'division' : 'carrera';
  const enRevision = ['PENDIENTE', 'PENDIENTE_DESACTIVACION'].includes(f.estadoAprobacion);
  const inactivo = f.estadoAprobacion === 'INACTIVO';
  const puedeEditar = !enRevision;
  const puedeEnviar = ['BORRADOR', 'RECHAZADO'].includes(f.estadoAprobacion);
  const puedeDesactivar = !enRevision && !inactivo;
  const motivo = f.estadoAprobacion === 'RECHAZADO' && f.motivoRechazo
    ? `<div style="font-size:12px;color:var(--danger);margin-top:4px">Motivo: ${esc(f.motivoRechazo)}</div>` : '';
  const datos = `data-tipo="${f.tipo}" data-id="${f.id}" data-nombre="${esc(f.nombre)}"`;

  return `<tr>
    <td class="tipo">${f.tipo === 'DIVISION' ? 'División' : 'Carrera'}</td>
    <td>${f.tipo === 'CARRERA' ? '&nbsp;&nbsp;↳ ' : ''}${esc(f.nombre)}</td>
    <td>${esc(f.division)}</td>
    <td>${badge(f.estatus)}</td>
    <td>${badge(f.estadoAprobacion)}${motivo}</td>
    <td class="actions">
      ${puedeEditar
        ? `<a class="btn sm secondary" href="${base}-form.html?id=${f.id}">Editar</a>`
        : `<button class="btn sm secondary" disabled>Editar</button>`}
      <button class="btn sm" ${puedeEnviar ? '' : 'disabled'} data-accion="enviar" ${datos}>Enviar a aprobación</button>
      <button class="btn sm danger" ${puedeDesactivar ? '' : 'disabled'} data-accion="desactivar" ${datos}>Solicitar desactivación</button>
    </td></tr>`;
}

async function cargarOferta() {
  const r = await Api.oferta.listar($nombre.value.trim(), $div.value);
  if (!r.ok) { $tbody.innerHTML = `<tr><td colspan="6" class="empty">No se pudo cargar la oferta</td></tr>`; return toast(r.data?.mensaje || 'Error', 'err'); }
  if (!r.data.length) { $tbody.innerHTML = `<tr><td colspan="6" class="empty">Sin resultados</td></tr>`; return; }
  $tbody.innerHTML = r.data.map(fila).join('');
}

$tbody.addEventListener('click', async e => {
  const b = e.target.closest('button[data-accion]'); if (!b || b.disabled) return;
  const api = b.dataset.tipo === 'DIVISION' ? Api.divisiones : Api.carreras;
  const enviar = b.dataset.accion === 'enviar';
  const pregunta = enviar ? `¿Enviar a aprobación "${b.dataset.nombre}"?` : `¿Solicitar la desactivación de "${b.dataset.nombre}"?`;
  if (!(await confirmar(pregunta))) return;
  const r = enviar ? await api.enviarAprobacion(b.dataset.id) : await api.solicitarDesactivacion(b.dataset.id);
  if (r.ok) { toast(r.data.mensaje); cargarOferta(); } else toast(r.data?.mensaje || 'Error', 'err');
});

let t; $nombre.addEventListener('input', () => { clearTimeout(t); t = setTimeout(cargarOferta, 300); });
$div.addEventListener('change', cargarOferta);
cargarDivisiones(); cargarOferta();
</script>
</body></html>
