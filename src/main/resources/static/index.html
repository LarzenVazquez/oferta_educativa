<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oferta académica</title><link rel="stylesheet" href="css/styles.css"></head>
<body>
<main>
  <div class="card">
    <h2>Divisiones</h2>
    <div class="toolbar">
      <span class="spacer"></span>
      <a class="btn" href="division-form.html">+ División</a>
    </div>
    <table>
      <thead><tr><th>Nombre</th><th>Descripción</th><th>Estatus</th><th>Aprobación</th><th></th></tr></thead>
      <tbody id="tDivisiones"><tr><td colspan="5" class="empty">Cargando…</td></tr></tbody>
    </table>
  </div>
</main>
<script src="js/api.js"></script>
<script>
renderHeader();

async function cargarDivisiones() {
  const $t = document.getElementById('tDivisiones');
  const r = await Api.divisiones.listar();
  if (!r.ok) { $t.innerHTML = `<tr><td colspan="5" class="empty">No se pudieron cargar las divisiones</td></tr>`; return toast(r.data?.mensaje || 'Error', 'err'); }
  if (!r.data.length) { $t.innerHTML = `<tr><td colspan="5" class="empty">Sin divisiones registradas</td></tr>`; return; }
  $t.innerHTML = r.data.map(x => {
    const bloqueado = ['PENDIENTE', 'PENDIENTE_DESACTIVACION'].includes(x.estadoAprobacion);
    const puedeDesactivar = bloqueado || x.estadoAprobacion === 'INACTIVO';
    return `<tr>
      <td>${esc(x.nombre)}</td>
      <td>${esc(x.descripcion)}</td>
      <td>${badge(x.estatus)}</td>
      <td>${badge(x.estadoAprobacion)}</td>
      <td class="actions">
        <a class="btn sm secondary" ${bloqueado ? 'disabled' : ''} href="division-form.html?id=${x.id}">Editar</a>
        <button class="btn sm danger" ${puedeDesactivar ? 'disabled' : ''} data-tipo="DIVISION" data-id="${x.id}" data-nombre="${esc(x.nombre)}">Solicitar desactivación</button>
      </td>
    </tr>`;
  }).join('');
}

function cargar() { cargarDivisiones(); }

document.querySelector('main').addEventListener('click', async e => {
  const b = e.target.closest('button[data-id]'); if (!b || b.disabled) return;
  const api = Api.divisiones;
  if (!(await confirmar(`¿Solicitar la desactivación de "${b.dataset.nombre}"?`))) return;
  const r = await api.solicitarDesactivacion(b.dataset.id);
  if (r.ok) { toast(r.data.mensaje); cargar(); } else toast(r.data?.mensaje || 'Error', 'err');
});
cargar();
</script>
</body></html>
