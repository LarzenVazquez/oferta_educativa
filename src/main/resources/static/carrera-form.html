<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carrera</title><link rel="stylesheet" href="css/styles.css"></head>
<body>
<main><div class="card" style="max-width:640px">
  <h2 id="titulo">Registrar carrera</h2>
  <div id="aviso"></div>
  <form id="form" novalidate>
    <div class="field"><label for="nombre">Nombre</label><input id="nombre" name="nombre">
      <div class="error" data-for="nombre"></div></div>
    <div class="field"><label for="descripcion">Descripción</label><textarea id="descripcion" name="descripcion"></textarea>
      <div class="error" data-for="descripcion"></div></div>
    <div class="row">
      <div class="field"><label for="duracionCuatrimestres">Duración (cuatrimestres)</label>
        <input id="duracionCuatrimestres" name="duracionCuatrimestres" type="number" min="1">
        <div class="error" data-for="duracionCuatrimestres"></div></div>
      <div class="field"><label for="modalidad">Modalidad</label>
        <select id="modalidad" name="modalidad"><option value="">Selecciona…</option>
          <option value="ESCOLARIZADA">Escolarizada</option><option value="MIXTA">Mixta</option><option value="EN_LINEA">En línea</option></select>
        <div class="error" data-for="modalidad"></div></div>
    </div>
    <div class="field"><label for="divisionId">División</label>
      <select id="divisionId" name="divisionId"><option value="">Selecciona…</option></select>
      <div class="error" data-for="divisionId"></div></div>
    <div class="form-actions"><button class="btn" type="submit">Guardar</button><a class="btn secondary" href="index.html">Cancelar</a></div>
  </form>
</div></main>
<script src="js/api.js"></script>
<script>
renderHeader();
const form = document.getElementById('form'), id = idDeUrl();

async function init() {
  // solo divisiones que no estén inactivas
  const rd = await Api.divisiones.listar();
  if (rd.ok) rd.data.filter(d => d.estadoAprobacion !== 'INACTIVO')
    .forEach(d => form.divisionId.insertAdjacentHTML('beforeend', `<option value="${d.id}">${esc(d.nombre)}</option>`));
  if (!id) return;

  document.getElementById('titulo').textContent = 'Editar carrera';
  const r = await Api.carreras.obtener(id);
  if (!r.ok) { toast(r.data?.mensaje || 'Error', 'err'); return; }
  const c = r.data;
  form.nombre.value = c.nombre; form.descripcion.value = c.descripcion;
  form.duracionCuatrimestres.value = c.duracionCuatrimestres; form.modalidad.value = c.modalidad;
  form.divisionId.value = c.division.id;
  if (c.estadoAprobacion === 'RECHAZADO' && c.motivoRechazo)
    document.getElementById('aviso').innerHTML = `<div class="note red"><b>Rechazada:</b> ${esc(c.motivoRechazo)}</div>`;
  if (['PENDIENTE', 'PENDIENTE_DESACTIVACION'].includes(c.estadoAprobacion)) {
    document.getElementById('aviso').innerHTML = `<div class="note">Tiene una solicitud en revisión; no se puede modificar.</div>`;
    form.querySelector('[type=submit]').disabled = true;
  }
}

form.addEventListener('submit', async e => {
  e.preventDefault(); limpiarErrores(form);
  const body = {
    nombre: form.nombre.value, descripcion: form.descripcion.value,
    duracionCuatrimestres: form.duracionCuatrimestres.value ? Number(form.duracionCuatrimestres.value) : null,
    modalidad: form.modalidad.value || null,
    division: form.divisionId.value ? { id: Number(form.divisionId.value) } : null
  };
  const r = id ? await Api.carreras.editar(id, body) : await Api.carreras.crear(body);
  if (r.ok) { toast(r.data.mensaje); setTimeout(() => location.href = 'index.html', 700); }
  else manejarError(form, r);
});
init();
</script>
</body></html>
